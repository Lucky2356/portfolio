name: build

on:
  push:
    branches: [main]
  # Сборка проверяется до слияния, а не после: проверки вложенности тегов,
  # нераскрытых шаблонов и потерянных @keyframes живут именно в ней.
  pull_request:
  workflow_dispatch:

# Наименьшие права по умолчанию. Сборка идёт и на pull_request, ставит
# зависимости и выполняет тесты — такой job не должен держать права на запись
# в Pages и на выпуск OIDC-токена. Они нужны только выкладке и выданы ей ниже.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Прерывать выкладку на полпути нельзя — Pages останется в промежуточном
  # состоянии. Новый запуск дожидается предыдущего.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Собрать сайт
        run: node scripts/build-site.mjs
      - name: Поставить зависимости для тестов
        run: npm ci --no-audit --no-fund
      - name: Поставить Chromium
        run: npx playwright install --with-deps chromium
      - name: Смоук-тесты в браузере
        run: npm test
      - name: Загрузить сборку для Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Публикация включается репозиторной переменной DEPLOY_PAGES=true
  # (Settings → Secrets and variables → Actions → Variables)
  # и режимом Settings → Pages → Source: GitHub Actions.
  deploy:
    needs: build
    if: ${{ github.event_name == 'push' && vars.DEPLOY_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
